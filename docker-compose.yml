services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The API runs with fixed CPU and memory so benchmark runs are comparable.
  api:
    profiles: ["app"]
    build: .
    cpus: 1.0
    mem_limit: 512m
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/booking
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      PROCESS_ROLE: ${PROCESS_ROLE:-all}
      MAX_IN_FLIGHT: ${MAX_IN_FLIGHT:-2000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      MAIL_DRIVER: json
      NODE_OPTIONS: ${NODE_OPTIONS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional: run with `--profile split` and PROCESS_ROLE=api on the api service to move
  # the email workers into their own container.
  worker:
    profiles: ["split"]
    build: .
    cpus: 0.5
    mem_limit: 256m
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/booking
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      DB_POOL_MAX: 10
      PROCESS_ROLE: worker
      RUN_MIGRATIONS: "false"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      MAIL_DRIVER: json
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
